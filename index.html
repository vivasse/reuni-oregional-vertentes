// INICIALIZAÇÃO DE DADOS (FIREBASE OU LOCALSTORAGE)
// ==========================================
(function init(){
  if(FIREBASE_CONFIG && window.firebase){
    try {
      firebase.initializeApp(FIREBASE_CONFIG);
      db = firebase.firestore();
      $("#syncStatus").textContent = "🟢 Nuvem Online";
      $("#syncStatus").className = "pill sync-ok";

      db.collection("links").onSnapshot(s=>{links=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.ord||0)-(b.ord||0));render()},()=>{});
      db.collection("config").doc("event").onSnapshot(s=>{const c=s.data&&s.data();if(c){if(c.name)D.name=c.name;if(c.dday)D.dday=c.dday}render()},()=>{});
      db.collection("tasks").onSnapshot(s=>{ov={};s.docs.forEach(d=>ov[d.id]=d.data());render()},()=>{});
      return;
    } catch(e) {
      console.warn("Falha ao inicializar Firebase, alternando para LocalStorage:", e);
    }
  }

  // Fallback: LocalStorage do navegador
  $("#syncStatus").textContent = "💾 Salvo no Navegador";
  $("#syncStatus").className = "pill sync-local";
  try {
    const lk = localStorage.getItem("pertencer_links");if(lk)links=JSON.parse(lk);
    const ts = localStorage.getItem("pertencer_tasks");if(ts)ov=JSON.parse(ts);
    const cf = localStorage.getItem("pertencer_cfg");if(cf){const c=JSON.parse(cf);D.name=c.name||D.name;D.dday=c.dday||D.dday}
  } catch(e){}
  render();
})();
