<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PERTENCER · Gestão do Roadmap</title>
<!-- Firebase SDKs compatíveis -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
:root {
  --bg: #f5f4ef;
  --card: #ffffff;
  --tx: #1c1c1a;
  --mu: #6b6a65;
  --bd: #e2e0d8;
  --ok: #2e8b57;
  --wip: #d9961a;
  --late: #d33f3f;
  --todo: #8c8a82;
  --sh: 0 1px 3px rgba(0,0,0,0.06), 0 4px 16px rgba(0,0,0,0.04);
  --sh-hover: 0 6px 20px rgba(0,0,0,0.08);
  --sidebar-w: 280px;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme=light]) {
    --bg: #141413;
    --card: #1f1f1d;
    --tx: #efeee9;
    --mu: #a2a199;
    --bd: #383731;
    --sh: 0 1px 3px rgba(0,0,0,0.3), 0 4px 18px rgba(0,0,0,0.25);
    --sh-hover: 0 6px 24px rgba(0,0,0,0.4);
    color-scheme: dark;
  }
}

:root[data-theme=dark] {
  --bg: #141413;
  --card: #1f1f1d;
  --tx: #efeee9;
  --mu: #a2a199;
  --bd: #383731;
  --sh: 0 1px 3px rgba(0,0,0,0.3), 0 4px 18px rgba(0,0,0,0.25);
  --sh-hover: 0 6px 24px rgba(0,0,0,0.4);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--tx);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  overflow-x: hidden;
}

button, input, select, textarea {
  font: inherit;
  color: var(--tx);
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 10px;
  padding: 7px 11px;
}
button { cursor: pointer; }

/* ==========================================
   APP LAYOUT (SIDEBAR + MAIN CONTENT)
   ========================================== */
.app-container {
  display: flex;
  min-height: 100vh;
  width: 100%;
}

/* Sidebar */
.sidebar {
  width: var(--sidebar-w);
  min-width: var(--sidebar-w);
  height: 100vh;
  position: sticky;
  top: 0;
  background: var(--card);
  border-right: 1px solid var(--bd);
  display: flex;
  flex-direction: column;
  z-index: 50;
  user-select: none;
  transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}

.sidebar-header {
  padding: 18px 18px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--bd);
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  background: none;
  border: none;
  padding: 0;
  text-align: left;
}

.brand-icon {
  font-size: 24px;
  line-height: 1;
}

.brand-text {
  display: flex;
  flex-direction: column;
}

.brand-title {
  font-size: 16px;
  font-weight: 700;
  margin: 0;
  color: var(--tx);
  letter-spacing: 0.3px;
}

.brand-sub {
  font-size: 11px;
  color: var(--mu);
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.7px;
}

.mobile-close-btn {
  display: none;
  background: none;
  border: none;
  font-size: 18px;
  color: var(--mu);
  padding: 4px 8px;
  border-radius: 6px;
}

/* Sidebar Summary Card */
.sidebar-summary {
  margin: 12px 14px;
  padding: 12px 14px;
  background: var(--bg);
  border: 1px solid var(--bd);
  border-radius: 12px;
}

.sidebar-dday-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
  font-size: 12px;
  font-weight: 600;
}

.sidebar-dday-badge {
  background: color-mix(in srgb, var(--late) 14%, transparent);
  color: var(--late);
  padding: 2px 8px;
  border-radius: 99px;
  font-size: 11px;
}

.sidebar-prog-track {
  height: 6px;
  background: var(--bd);
  border-radius: 99px;
  overflow: hidden;
  margin-bottom: 6px;
}

.sidebar-prog-fill {
  height: 100%;
  background: var(--ok);
  border-radius: 99px;
  transition: width 0.3s ease;
}

.sidebar-prog-labels {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: var(--mu);
}

/* Sidebar Nav */
.sidebar-nav {
  flex: 1;
  overflow-y: auto;
  padding: 8px 12px 16px;
  display: flex;
  flex-direction: column;
  gap: 3px;
  scrollbar-width: thin;
}

.nav-section-title {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--mu);
  padding: 12px 8px 6px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.nav-section-badge {
  background: var(--bd);
  color: var(--tx);
  font-size: 10px;
  padding: 1px 7px;
  border-radius: 99px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 9px 12px;
  border-radius: 10px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--tx);
  text-align: left;
  font-size: 13.5px;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
}

.nav-item:hover {
  background: var(--bg);
}

.nav-item.on {
  background: color-mix(in srgb, var(--tx) 8%, var(--card));
  border-color: var(--bd);
  font-weight: 600;
}

.nav-item-icon {
  font-size: 16px;
  width: 20px;
  text-align: center;
  flex: none;
}

.nav-item-text {
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.nav-item-tag {
  font-size: 11px;
  color: var(--mu);
  background: var(--bg);
  padding: 1px 7px;
  border-radius: 99px;
  border: 1px solid var(--bd);
}

/* Coordenadoria Nav Item */
.sidebar-coords {
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.coord-nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 8px 12px;
  border-radius: 10px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--tx);
  text-align: left;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s;
}

.coord-nav-item:hover {
  background: var(--bg);
  transform: translateX(2px);
}

.coord-nav-item.on {
  background: color-mix(in srgb, var(--cc) 12%, var(--card));
  border-color: color-mix(in srgb, var(--cc) 35%, var(--bd));
  font-weight: 600;
}

.coord-nav-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--cc);
  flex: none;
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--cc) 25%, transparent);
}

.coord-nav-name {
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.coord-nav-badges {
  display: flex;
  align-items: center;
  gap: 5px;
  flex: none;
}

.coord-late-badge {
  background: var(--late);
  color: #fff;
  font-size: 10px;
  font-weight: 700;
  padding: 1px 6px;
  border-radius: 99px;
  display: inline-flex;
  align-items: center;
}

.coord-count-badge {
  font-size: 11px;
  color: var(--mu);
}

/* Sidebar Footer */
.sidebar-footer {
  padding: 12px 14px;
  border-top: 1px solid var(--bd);
  display: flex;
  flex-direction: column;
  gap: 8px;
  background: var(--card);
}

.sidebar-status-pill {
  display: flex;
  align-items: center;
  justify-content: flex-start;
}

.sidebar-btn-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}

.sidebar-btn-grid .sidebar-btn:last-child:nth-child(odd) {
  grid-column: span 2;
}

.sidebar-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 6px 10px;
  font-size: 12px;
  border-radius: 8px;
  border: 1px solid var(--bd);
  background: var(--bg);
  color: var(--tx);
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.15s, border-color 0.15s;
}

.sidebar-btn:hover {
  background: var(--card);
  border-color: var(--mu);
}

/* ==========================================
   MAIN CONTENT WRAPPER & TOPBAR
   ========================================== */
.main-wrapper {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  background: var(--bg);
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 24px;
  background: var(--card);
  border-bottom: 1px solid var(--bd);
  position: sticky;
  top: 0;
  z-index: 40;
}

.topbar-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.menu-toggle-btn {
  display: none;
  background: none;
  border: 1px solid var(--bd);
  border-radius: 8px;
  padding: 6px 8px;
  align-items: center;
  justify-content: center;
  color: var(--tx);
  cursor: pointer;
}

.topbar-crumb {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13.5px;
}

.crumb-parent {
  color: var(--mu);
}

.crumb-sep {
  color: var(--bd);
}

.crumb-active {
  font-weight: 600;
  color: var(--tx);
}

.topbar-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.pill {
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 99px;
  padding: 5px 12px;
  font-size: 12px;
  color: var(--mu);
}
.pill.sync-ok { border-color: var(--ok); color: var(--ok); }
.pill.sync-local { border-color: var(--wip); color: var(--wip); }

main {
  padding: 20px 24px 80px;
  max-width: 1360px;
  width: 100%;
  margin: 0 auto;
}

/* ==========================================
   TELA INICIAL (OVERVIEW) REDESIGN
   ========================================== */
.ov-wrap {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

/* Hero Banner */
.ov-hero {
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 18px;
  padding: 24px;
  box-shadow: var(--sh);
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 20px;
  align-items: center;
  position: relative;
  overflow: hidden;
}

.ov-hero::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 4px;
  background: linear-gradient(90deg, #5b6bd6, #d6537a, #e08a2c, #2f9e8f, #8a5bc7);
}

.ov-hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11.5px;
  font-weight: 600;
  color: var(--mu);
  background: var(--bg);
  border: 1px solid var(--bd);
  border-radius: 99px;
  padding: 3px 10px;
  margin-bottom: 8px;
}

.ov-hero-title {
  font-size: 22px;
  font-weight: 800;
  margin: 0 0 6px;
  color: var(--tx);
  letter-spacing: -0.3px;
}

.ov-hero-sub {
  font-size: 13.5px;
  color: var(--mu);
  margin: 0;
  max-width: 600px;
  line-height: 1.5;
}

.ov-hero-stats {
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
}

.ov-hero-stat-card {
  background: var(--bg);
  border: 1px solid var(--bd);
  border-radius: 14px;
  padding: 12px 18px;
  display: flex;
  flex-direction: column;
  min-width: 140px;
}

.ov-hero-stat-val {
  font-size: 20px;
  font-weight: 700;
  color: var(--tx);
  line-height: 1.2;
}

.ov-hero-stat-lbl {
  font-size: 11.5px;
  color: var(--mu);
  margin-top: 3px;
}

/* KPIs */
.kpis {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 12px;
  margin: 0;
}

.kpi {
  background: var(--card);
  border-radius: 14px;
  padding: 14px 16px;
  box-shadow: var(--sh);
  border: 1px solid var(--bd);
  border-left: 5px solid var(--kc, var(--tx));
  transition: transform 0.15s, box-shadow 0.15s;
}

.kpi:hover {
  transform: translateY(-2px);
  box-shadow: var(--sh-hover);
}

.kpi-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
}

.kpi-head span:first-child {
  font-size: 12px;
  font-weight: 600;
  color: var(--mu);
}

.kpi-icon {
  font-size: 15px;
}

.kpi b {
  display: block;
  font-size: 26px;
  font-weight: 700;
  line-height: 1.15;
  color: var(--tx);
}

.kpi-sub {
  font-size: 11.5px;
  color: var(--mu);
  margin-top: 2px;
}

/* Coordenadorias Section */
.ov-section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 8px 0 2px;
  flex-wrap: wrap;
  gap: 8px;
}

.ov-section-title {
  font-size: 16px;
  font-weight: 700;
  margin: 0;
  display: flex;
  align-items: center;
  gap: 8px;
}

.ov-section-sub {
  font-size: 12.5px;
  color: var(--mu);
  margin-top: 2px;
}

.coords-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
  gap: 14px;
}

.coord-card {
  background: var(--card);
  border-radius: 16px;
  padding: 16px 18px;
  box-shadow: var(--sh);
  border: 1px solid var(--bd);
  border-top: 5px solid var(--cc);
  cursor: pointer;
  transition: transform 0.18s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.18s, border-color 0.18s;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.coord-card:hover {
  transform: translateY(-3px);
  box-shadow: var(--sh-hover);
  border-color: color-mix(in srgb, var(--cc) 40%, var(--bd));
}

.coord-card-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
}

.coord-card-title {
  margin: 0;
  font-size: 15px;
  font-weight: 700;
  color: var(--tx);
  line-height: 1.3;
}

.coord-card-badge {
  font-size: 11px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 99px;
  flex: none;
}

.coord-card-badge.late {
  background: color-mix(in srgb, var(--late) 14%, transparent);
  color: var(--late);
}

.coord-card-badge.ok {
  background: color-mix(in srgb, var(--ok) 14%, transparent);
  color: var(--ok);
}

.coord-card-badge.neutral {
  background: var(--bg);
  color: var(--mu);
  border: 1px solid var(--bd);
}

.coord-card-body {
  display: flex;
  align-items: center;
  gap: 16px;
}

.coord-card-stats {
  flex: 1;
  font-size: 12.5px;
  line-height: 1.6;
  color: var(--mu);
}

.coord-card-stats strong {
  color: var(--tx);
}

.coord-card-footer {
  margin-top: auto;
  padding-top: 10px;
  border-top: 1px solid var(--bd);
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12px;
  font-weight: 600;
  color: var(--cc);
}

.coord-card-footer span.arrow {
  transition: transform 0.15s;
}

.coord-card:hover .coord-card-footer span.arrow {
  transform: translateX(4px);
}

/* Split Row: Atrasadas e Próximos Vencimentos */
.ov-split-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
}

.ov-panel {
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 16px;
  padding: 18px;
  box-shadow: var(--sh);
}

.ov-panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}

.ov-panel-title {
  font-size: 15px;
  font-weight: 700;
  margin: 0;
  display: flex;
  align-items: center;
  gap: 8px;
}

.ov-panel-count {
  font-size: 11.5px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 99px;
  background: var(--bg);
  border: 1px solid var(--bd);
  color: var(--tx);
}

.ov-panel-count.late {
  background: var(--late);
  color: #fff;
  border-color: var(--late);
}

.ov-panel-cards {
  display: flex;
  flex-direction: column;
  gap: 9px;
}

.ov-empty-state {
  text-align: center;
  padding: 28px 16px;
  color: var(--mu);
  font-size: 13px;
  background: var(--bg);
  border: 1.5px dashed var(--bd);
  border-radius: 12px;
}

.ov-empty-icon {
  font-size: 26px;
  margin-bottom: 6px;
  display: block;
}

/* ==========================================
   CARDS, RINGS, GANTT & BOARDS
   ========================================== */
.ring {
  --p: 0;
  width: 62px;
  height: 62px;
  border-radius: 50%;
  background: conic-gradient(var(--cc) calc(var(--p)*1%), var(--bd) 0);
  display: grid;
  place-items: center;
  flex: none;
}
.ring i {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  background: var(--card);
  display: grid;
  place-items: center;
  font: 700 13px system-ui;
  font-style: normal;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 12px;
}

.card {
  background: var(--card);
  border-radius: 12px;
  padding: 11px 12px 10px;
  margin-bottom: 9px;
  box-shadow: var(--sh);
  border-left: 4px solid var(--cc);
  border-top: 1px solid var(--bd);
  border-right: 1px solid var(--bd);
  border-bottom: 1px solid var(--bd);
  cursor: grab;
  transition: transform 0.12s, box-shadow 0.12s;
  position: relative;
}
.card:hover { transform: translateY(-2px); box-shadow: var(--sh-hover); }
.card.dn .tt { text-decoration: line-through; color: var(--mu); }
.ph { font-size: 11px; color: var(--mu); margin-bottom: 3px; font-weight: 500; }
.tt { font-weight: 600; padding-right: 26px; line-height: 1.35; }
.ck {
  position: absolute;
  right: 9px;
  top: 9px;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  padding: 0;
  display: grid;
  place-items: center;
  font-size: 12px;
  border: 2px solid var(--bd);
  background: none;
}
.dn .ck { background: var(--ok); border-color: var(--ok); color: #fff; }
.ft { display: flex; align-items: center; gap: 6px; margin-top: 9px; flex-wrap: wrap; }
.due { font-size: 11px; border-radius: 99px; padding: 2px 9px; background: rgba(128,128,128,0.15); font-weight: 500; }
.due.late { background: var(--late); color: #fff; }
.due.soon { background: #f3b42e55; }
.due.ok { background: #2e8b5733; color: var(--ok); }
.av {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  padding: 0;
  display: grid;
  place-items: center;
  font: 700 11px system-ui;
  color: #fff;
  margin-left: auto;
  border: 0;
}
.av.e { background: none; color: var(--mu); border: 1.5px dashed var(--mu); font-size: 14px; }
.sd { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.sub { color: var(--mu); font-size: 12.5px; }

/* Coordination Board View */
.hd { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin: 4px 0 16px; }
.hd h2 { margin: 0; font-size: 22px; font-weight: 800; flex: 1; min-width: 200px; }
.bar { height: 8px; background: var(--bd); border-radius: 5px; overflow: hidden; width: 180px; }
.bar i { display: block; height: 100%; background: var(--cc); border-radius: 5px; }
.seg { display: flex; border: 1px solid var(--bd); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; background: none; padding: 6px 12px; }
.seg .on { background: var(--tx); color: var(--bg); font-weight: 600; }
.fl { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
.fl input { min-width: 150px; }

.col { background: rgba(128,128,128,0.08); border-radius: 16px; padding: 12px; min-height: 250px; scroll-snap-align: start; transition: background 0.15s; }

/* Gantt Chart */

.gr.gh { position: sticky; top: 0; z-index: 5; background: var(--card); height: 30px; }
.gl { position: sticky; left: 0; z-index: 2; width: 280px; flex: none; background: var(--card); padding: 0 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12.5px; border-right: 1px solid var(--bd); height: 100%; display: flex; align-items: center; cursor: pointer; }
.gr.c .gl, .gr.c .gt { background-color: color-mix(in srgb, var(--cc) 14%, var(--card)); font-weight: 700; }
.gr.p .gl { font-weight: 600; padding-left: 20px; }
.gr.t .gl { padding-left: 36px; }
.gt { position: relative; height: 100%; background-image: linear-gradient(90deg, var(--bd) 1px, transparent 1px); }
.gh .gt { background: none; }
.gh span { position: absolute; top: 7px; font-size: 11px; color: var(--mu); }
.gb { position: absolute; top: 9px; height: 14px; border-radius: 7px; min-width: 6px; }
.gr.p .gb, .gr.c .gb { top: 11px; height: 10px; }
.gm { position: absolute; top: 0; bottom: 0; width: 2px; z-index: 1; opacity: 0.8; }

.lg b { color: var(--tx); font-weight: 700; margin-right: 2px; }

    )

}

function cfgModal(){

function backupModal(){
  const S=$("#sh"),O=$("#ov");S.style.setProperty("--cc","var(--tx)");O.style.display="flex";
  const jsonArea=h("textarea",{style:"min-height:160px;font-family:monospace;font-size:11px",value:JSON.stringify({ov,links,config:{name:D.name,dday:D.dday}},null,2)});
  S.replaceChildren(
    h("h3",{style:"margin:0 0 10px"},"💾 Backup e Sincronização"),
    h("p",{cls:"sub"},"Copie o JSON abaixo para salvar no seu computador ou cole um JSON para restaurar os dados:"),
    jsonArea,
    h("div",{cls:"btns",style:"margin-top:10px"},
      h("button",{on:{click:()=>{
        const blob=new Blob([jsonArea.value],{type:"application/json"});
        const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`pertencer-backup-${TODAY}.json`;a.click();
      }}},"Baixar arquivo .json"),
      h("button",{cls:"add",style:"background:var(--ok)",on:{click:()=>{
        try{
          const data=JSON.parse(jsonArea.value);
          if(data.ov)ov=data.ov;
          if(data.links)links=data.links;
          if(data.config){D.name=data.config.name||D.name;D.dday=data.config.dday||D.dday}
          localStorage.setItem("pertencer_tasks",JSON.stringify(ov));
          localStorage.setItem("pertencer_links",JSON.stringify(links));
          localStorage.setItem("pertencer_cfg",JSON.stringify(data.config||{}));
          render();O.style.display="none";toast("Dados restaurados com sucesso!");
        }catch(e){toast("JSON inválido. Verifique o formato.")}
      }}},"Restaurar JSON"),
      h("button",{on:{click:()=>O.style.display="none"}},"Fechar")
    )
  );
}

function newTask(c){
  const id="x"+Date.now(),e=iso(new Date(Date.now()+7*DAY)),p=(D.phases.find(p=>p.coord===c)||{}).id||"1.1";
  save(id,{n:1,t:"Nova tarefa",c,p:fph||p,s:TODAY,e,st:"Não iniciado"});
  mid=id;
  modal();
}

function pick(id,btn){
  const P=$("#pop"),r=btn.getBoundingClientRect(),I=$("#pq"),R=$("#pr");
  P.style.display="block";
  P.style.top=Math.max(8,Math.min(r.bottom+4,innerHeight-230))+"px";
  P.style.left=Math.max(8,Math.min(r.left,innerWidth-262))+"px";
  I.value="";I.focus();pt=id;
  const draw=()=>{
    const v=I.value.trim(),cur=all().find(t=>t.id===id);
    R.replaceChildren(...(v?[h("div",{on:{click:()=>fin({on:v})}},`Definir "${v}"`)]:[]),...(cur&&cur.on?[h("div",{style:"color:var(--late)",on:{click:()=>fin({on:""})}},"Remover responsável")]:[]));
  };
  I.oninput=draw;
  draw();
}
const fin=p=>{$("#pop").style.display="none";save(pt,p)};

function setSyncStatus(text, cls){
  const el = $("#syncStatus"), txt = $("#syncStatusText");
  if(txt) txt.textContent = text;
  else if(el) el.textContent = text;
  if(el){
    el.className = "pill " + (cls || "");
  }
}

async function initFirebase(cfg){
  if(!cfg || !window.firebase) return false;
  try {
    if(window.firebase.apps && window.firebase.apps.length){
      await Promise.all(window.firebase.apps.map(app => app.delete()));
    }
    firebase.initializeApp(cfg);
    db = firebase.firestore();
    setSyncStatus("🟢 Nuvem Online (Firebase)", "sync-ok");

    // Listeners em tempo real
    db.collection("links").onSnapshot(s => {
      links = s.docs.map(d => ({id: d.id, ...d.data()})).sort((a,b) => (a.ord||0) - (b.ord||0));
      localStorage.setItem("pertencer_links", JSON.stringify(links));
      render();
    }, err => {
      console.warn("Erro no listener de links:", err);
    });

    db.collection("config").doc("event").onSnapshot(s => {
      const c = s.data && s.data();
      if(c){
        if(c.name) D.name = c.name;
        if(c.dday) D.dday = c.dday;
        localStorage.setItem("pertencer_cfg", JSON.stringify({name: D.name, dday: D.dday}));
      }
      render();
    }, err => {
      console.warn("Erro no listener de config:", err);
    });

    db.collection("tasks").onSnapshot(s => {
      ov = {};
      s.docs.forEach(d => ov[d.id] = d.data());
      localStorage.setItem("pertencer_tasks", JSON.stringify(ov));
      render();
    }, err => {
      console.warn("Erro no listener de tarefas:", err);
      setSyncStatus("⚠️ Erro de Permissão Firebase", "sync-local");
    });

    localStorage.setItem("pertencer_firebase_config", JSON.stringify(cfg));
    return true;
  } catch(e) {
    console.error("Falha ao inicializar Firebase:", e);
    setSyncStatus("❌ Erro no Firebase", "sync-local");
    toast("Falha ao conectar no Firebase: " + (e.message || e));
    return false;
  }
}

async function uploadAllToFirebase(){
  if(!db){ toast("Firebase não conectado."); return; }
  try {
    toast("Enviando dados locais para o Firebase...");
    await db.collection("config").doc("event").set({name: D.name, dday: D.dday});
    for(const l of links){
      await db.collection("links").doc(l.id).set(l);
    }
    const allTasks = all();
    for(const t of allTasks){
      const patch = ov[t.id] || {};
      if(Object.keys(patch).length > 0){
        await db.collection("tasks").doc(t.id).set(patch);
      }
    }
    toast("Todos os dados foram salvos no Firebase! 🚀");
  } catch(e) {
    console.error("Erro no upload:", e);
    toast("Erro ao sincronizar com Firebase: " + (e.message || e));
  }
}

function firebaseModal(){
  const S = $("#sh"), O = $("#ov");
  S.style.setProperty("--cc", "var(--ok)");
  O.style.display = "flex";

  const savedCfg = localStorage.getItem("pertencer_firebase_config");
  const isConnected = !!db;

  const statusBox = isConnected
    ? h("div", {style: "background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok);padding:10px 14px;border-radius:10px;font-weight:600;margin-bottom:12px;font-size:13px;display:flex;align-items:center;gap:8px"},
        "🟢 Sincronização ativa via Firebase Firestore (Tempo real)")
    : h("div", {style: "background:color-mix(in srgb,var(--wip) 14%,transparent);color:var(--wip);padding:10px 14px;border-radius:10px;font-weight:600;margin-bottom:12px;font-size:13px;display:flex;align-items:center;gap:8px"},
        "💾 Armazenamento atual: LocalStorage (Offline no Navegador)");

  const cfgArea = h("textarea", {
    style: "min-height:140px;font-family:monospace;font-size:12px",
    placeholder: 'Cole aqui o objeto firebaseConfig:\n{\n  apiKey: "...",\n  authDomain: "...",\n  projectId: "...",\n  storageBucket: "...",\n  messagingSenderId: "...",\n  appId: "..."\n}',
    value: savedCfg ? JSON.stringify(JSON.parse(savedCfg), null, 2) : (FIREBASE_CONFIG ? JSON.stringify(FIREBASE_CONFIG, null, 2) : "")
  });

  const close = () => { O.style.display = "none"; };

  S.replaceChildren(
    h("h3", {style: "margin:0 0 10px;display:flex;align-items:center;gap:8px"}, "🔥 Configuração do Firebase Firestore"),
    h("p", {cls: "sub", style: "margin:0 0 12px"}, "Conecte as credenciais do seu projeto Firebase para sincronizar tarefas, prazos e links entre todos os coordenadores em tempo real."),
    statusBox,
    h("label", {}, "Credenciais do Firebase (Objeto SDK ou JSON)", cfgArea),
    h("div", {cls: "btns", style: "margin-top:14px;flex-wrap:wrap;gap:8px"},
      isConnected ? h("button", {
        style: "color:var(--late)",
        on: {
          click: () => {
            if(confirm("Deseja desconectar do Firebase e voltar a salvar apenas no navegador?")){
              localStorage.removeItem("pertencer_firebase_config");
              db = null;
              setSyncStatus("💾 LocalStorage (Conectar Firebase)", "sync-local");
              toast("Desconectado do Firebase.");
              close();
              render();
            }
          }
        }
      }, "Desconectar") : h("span"),
      isConnected ? h("button", {
        style: "background:var(--card);border:1px solid var(--bd)",
        on: {click: uploadAllToFirebase}
      }, "📤 Subir dados locais p/ Nuvem") : h("span"),
      h("button", {on: {click: close}}, "Fechar"),
      h("button", {
        cls: "add",
        style: "background:var(--ok)",
        on: {
          click: async () => {
            const raw = cfgArea.value.trim();
            if(!raw){
              toast("Cole as credenciais do Firebase.");
              return;
            }
            try {
              let parsed;
              const clean = raw.replace(/^(const|let|var)\s+\w+\s*=\s*/, "").replace(/;?\s*$/, "");
              try {
                parsed = JSON.parse(clean);
              } catch(e) {
                parsed = new Function("return (" + clean + ")")();
              }
              if(!parsed || !parsed.apiKey || !parsed.projectId){
                toast("Configuração inválida. Os campos apiKey e projectId são obrigatórios.");
                return;
              }
              const ok = await initFirebase(parsed);
              if(ok){
                toast("Conectado ao Firebase com sucesso!");
                close();
                render();
              }
            } catch(err) {
              toast("Erro ao ler credenciais: " + err.message);
            }
          }
        }
      }, "Conectar ao Firebase")
    )
  );
}

// ==========================================
// INICIALIZAÇÃO DE DADOS (FIREBASE OU LOCALSTORAGE)
// ==========================================
(function init(){
  // Initialize theme
  const savedTheme=localStorage.getItem("pertencer_theme");
  if(savedTheme){document.documentElement.setAttribute("data-theme",savedTheme)}
  updateThemeIcon();

  // Load local cache first so UI responds immediately
  try {
    const lk = localStorage.getItem("pertencer_links");if(lk)links=JSON.parse(lk);
    const ts = localStorage.getItem("pertencer_tasks");if(ts)ov=JSON.parse(ts);
    const cf = localStorage.getItem("pertencer_cfg");if(cf){const c=JSON.parse(cf);D.name=c.name||D.name;D.dday=c.dday||D.dday}
  } catch(e){}

  // Check for Firebase config (code or saved)
  const savedFb = localStorage.getItem("pertencer_firebase_config");
  let activeFb = null;
  if(FIREBASE_CONFIG){
    activeFb = FIREBASE_CONFIG;
  } else if(savedFb){
    try { activeFb = JSON.parse(savedFb); } catch(e){}
  }

  if(activeFb && window.firebase){
    initFirebase(activeFb);
  } else {
    setSyncStatus("💾 LocalStorage (Conectar Firebase)", "sync-local");
  }

  render();
})();
</script>
