<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PERTENCER · Roadmap Regional</title>

<!-- Google Font: Montserrat (300, 400, 500, 600, 700, 800) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,500&display=swap" rel="stylesheet">

<!-- Firebase SDKs compatíveis -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
:root {
  --font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  
  /* Paleta Limpa e Moderna (SaaS Slate / Neutral) */
  --bg: #f8fafc;
  --card: #ffffff;
  --card-subtle: #f1f5f9;
  --tx: #0f172a;
  --mu: #64748b;
  --mu-light: #94a3b8;
  --bd: #e2e8f0;
  --bd-subtle: #f1f5f9;
  
  /* Cores de Status Refinadas */
  --ok: #10b981;
  --wip: #f59e0b;
  --late: #ef4444;
  --todo: #94a3b8;
  --primary: #4f46e5;

  /* Sombras Sutis e Precisas */
  --sh: 0 1px 3px rgba(15, 23, 42, 0.05), 0 1px 2px rgba(15, 23, 42, 0.03);
  --sh-card: 0 1px 3px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
  --sh-hover: 0 6px 16px -2px rgba(15, 23, 42, 0.08), 0 2px 6px -2px rgba(15, 23, 42, 0.04);
  
  --sidebar-w: 260px;
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;

  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme=light]) {
    --bg: #0b0f19;
    --card: #111827;
    --card-subtle: #1e293b;
    --tx: #f8fafc;
    --mu: #94a3b8;
    --mu-light: #64748b;
    --bd: #1e293b;
    --bd-subtle: #162032;
    --sh: 0 1px 3px rgba(0, 0, 0, 0.4);
    --sh-card: 0 1px 3px rgba(0, 0, 0, 0.4);
    --sh-hover: 0 8px 24px rgba(0, 0, 0, 0.5);
    color-scheme: dark;
  }
}

:root[data-theme=dark] {
  --bg: #0b0f19;
  --card: #111827;
  --card-subtle: #1e293b;
  --tx: #f8fafc;
  --mu: #94a3b8;
  --mu-light: #64748b;
  --bd: #1e293b;
  --bd-subtle: #162032;
  --sh: 0 1px 3px rgba(0, 0, 0, 0.4);
  --sh-card: 0 1px 3px rgba(0, 0, 0, 0.4);
  --sh-hover: 0 8px 24px rgba(0, 0, 0, 0.5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }

body {
  margin: 0;
  background: var(--bg);
  color: var(--tx);
  font-family: var(--font-family);
  font-size: 13.5px;
  line-height: 1.5;
  letter-spacing: -0.01em;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
}

button, input, select, textarea {
  font-family: var(--font-family);
  font-size: inherit;
  color: var(--tx);
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: var(--radius-md);
  padding: 8px 12px;
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
}

button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
}

button { cursor: pointer; }

/* ==========================================
   ESTRUTURA PRINCIPAL (SIDEBAR + CONTEÚDO)
   ========================================== */
.app-container {
  display: flex;
  min-height: 100vh;
  width: 100%;
}

/* Sidebar */
.sidebar {
  width: var(--sidebar-w);
  min-width: var(--sidebar-w);
  height: 100vh;
  position: sticky;
  top: 0;
  background: var(--card);
  border-right: 1px solid var(--bd);
  display: flex;
  flex-direction: column;
  z-index: 50;
  user-select: none;
  transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}

.sidebar-header {
  padding: 20px 18px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--bd);
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  background: none;
  border: none;
  padding: 0;
  text-align: left;
}

.brand-icon-box {
  width: 32px;
  height: 32px;
  border-radius: var(--radius-md);
  background: var(--tx);
  color: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  flex: none;
}

.brand-text {
  display: flex;
  flex-direction: column;
}

.brand-title {
  font-size: 14.5px;
  font-weight: 700;
  margin: 0;
  color: var(--tx);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  line-height: 1.2;
}

.brand-sub {
  font-size: 10.5px;
  color: var(--mu);
  font-weight: 500;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  margin-top: 2px;
}

.mobile-close-btn {
  display: none;
  background: none;
  border: none;
  font-size: 16px;
  color: var(--mu);
  padding: 4px 8px;
  border-radius: var(--radius-sm);
}

/* Mini Card de Progresso na Sidebar */
.sidebar-summary {
  margin: 14px 14px 8px;
  padding: 12px 14px;
  background: var(--card-subtle);
  border: 1px solid var(--bd);
  border-radius: var(--radius-md);
}

.sidebar-dday-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
  font-size: 11.5px;
  font-weight: 600;
}

.sidebar-dday-badge {
  background: var(--card);
  border: 1px solid var(--bd);
  color: var(--tx);
  padding: 2px 8px;
  border-radius: 99px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: -0.01em;
}

.sidebar-prog-track {
  height: 4px;
  background: var(--bd);
  border-radius: 99px;
  overflow: hidden;
  margin-bottom: 7px;
}

.sidebar-prog-fill {
  height: 100%;
  background: var(--ok);
  border-radius: 99px;
  transition: width 0.3s ease;
}

.sidebar-prog-labels {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: var(--mu);
  font-weight: 500;
}

/* Navegação da Sidebar */
.sidebar-nav {
  flex: 1;
  overflow-y: auto;
  padding: 8px 12px 16px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  scrollbar-width: thin;
}

.nav-section-title {
  font-size: 10.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--mu-light);
  padding: 14px 8px 6px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.nav-section-badge {
  background: var(--bd);
  color: var(--tx);
  font-size: 10px;
  font-weight: 600;
  padding: 1px 6px;
  border-radius: 99px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 8px 10px;
  border-radius: var(--radius-md);
  border: 1px solid transparent;
  background: transparent;
  color: var(--mu);
  text-align: left;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.15s, color 0.15s, border-color 0.15s;
}

.nav-item:hover {
  background: var(--card-subtle);
  color: var(--tx);
}

.nav-item.on {
  background: var(--card-subtle);
  border-color: var(--bd);
  color: var(--tx);
  font-weight: 600;
}

.nav-item-icon {
  width: 18px;
  height: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex: none;
  opacity: 0.8;
}

.nav-item.on .nav-item-icon {
  opacity: 1;
}

.nav-item-text {
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.nav-item-tag {
  font-size: 10.5px;
  font-weight: 600;
  color: var(--mu);
  background: var(--card);
  padding: 1px 6px;
  border-radius: 99px;
  border: 1px solid var(--bd);
}

/* Lista de Coordenadorias */
.sidebar-coords {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.coord-nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 7px 10px;
  border-radius: var(--radius-md);
  border: 1px solid transparent;
  background: transparent;
  color: var(--mu);
  text-align: left;
  font-size: 12.5px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s;
}

.coord-nav-item:hover {
  background: var(--card-subtle);
  color: var(--tx);
}

.coord-nav-item.on {
  background: var(--card-subtle);
  border-color: var(--bd);
  color: var(--tx);
  font-weight: 600;
}

.coord-nav-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--cc);
  flex: none;
}

.coord-nav-name {
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.coord-nav-badges {
  display: flex;
  align-items: center;
  gap: 6px;
  flex: none;
}

.coord-late-badge {
  background: var(--late);
  color: #fff;
  font-size: 10px;
  font-weight: 700;
  padding: 1px 5px;
  border-radius: 99px;
}

.coord-count-badge {
  font-size: 11px;
  color: var(--mu-light);
  font-weight: 500;
}

/* Rodapé da Sidebar */
.sidebar-footer {
  padding: 14px;
  border-top: 1px solid var(--bd);
  display: flex;
  flex-direction: column;
  gap: 8px;
  background: var(--card);
}

.sidebar-status-pill {
  width: 100%;
}

.sidebar-btn-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}

.sidebar-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 7px 8px;
  font-size: 11.5px;
  font-weight: 500;
  border-radius: var(--radius-sm);
  border: 1px solid var(--bd);
  background: var(--card);
  color: var(--mu);
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.15s;
}

.sidebar-btn:hover {
  background: var(--card-subtle);
  color: var(--tx);
  border-color: var(--mu-light);
}

/* ==========================================
   TOPBAR & CONTEÚDO PRINCIPAL
   ========================================== */
.main-wrapper {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  background: var(--bg);
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 28px;
  background: var(--card);
  border-bottom: 1px solid var(--bd);
  position: sticky;
  top: 0;
  z-index: 40;
}

.topbar-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.menu-toggle-btn {
  display: none;
  background: none;
  border: 1px solid var(--bd);
  border-radius: var(--radius-sm);
  padding: 6px;
  align-items: center;
  justify-content: center;
  color: var(--tx);
  cursor: pointer;
}

.topbar-crumb {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
}

.crumb-parent {
  color: var(--mu);
  font-weight: 500;
}

.crumb-sep {
  color: var(--bd);
}

.crumb-active {
  font-weight: 600;
  color: var(--tx);
}

.topbar-right {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.pill {
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 99px;
  padding: 5px 12px;
  font-size: 12px;
  font-weight: 500;
  color: var(--mu);
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.pill.sync-ok { border-color: color-mix(in srgb, var(--ok) 40%, var(--bd)); color: var(--ok); }
.pill.sync-local { border-color: var(--bd); color: var(--mu); }

main {
  padding: 24px 28px 80px;
  max-width: 1400px;
  width: 100%;
  margin: 0 auto;
}

/* ==========================================
   TELA INICIAL (VISÃO GERAL DO ROADMAP)
   ========================================== */
.ov-wrap {
  display: flex;
  flex-direction: column;
  gap: 24px;
}

/* Header da Visão Geral */
.ov-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  padding-bottom: 4px;
}

.ov-header-left h2 {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -0.02em;
  margin: 0 0 4px;
  color: var(--tx);
}

.ov-header-left p {
  font-size: 13px;
  color: var(--mu);
  margin: 0;
}

.ov-header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.btn-secondary {
  background: var(--card);
  border: 1px solid var(--bd);
  color: var(--tx);
  font-weight: 600;
  font-size: 12.5px;
  padding: 8px 14px;
  border-radius: var(--radius-md);
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all 0.15s;
}

.btn-secondary:hover {
  background: var(--card-subtle);
  border-color: var(--mu-light);
}

/* Métricas KPIs em Linha */
.kpis {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  gap: 12px;
  margin: 0;
}

.kpi {
  background: var(--card);
  border-radius: var(--radius-md);
  padding: 16px 18px;
  box-shadow: var(--sh);
  border: 1px solid var(--bd);
  transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
  position: relative;
}

.kpi:hover {
  transform: translateY(-2px);
  box-shadow: var(--sh-hover);
  border-color: var(--mu-light);
}

.kpi-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}

.kpi-label {
  font-size: 11.5px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--mu);
}

.kpi-indicator {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--kc, var(--tx));
}

.kpi b {
  display: block;
  font-size: 26px;
  font-weight: 700;
  line-height: 1.15;
  color: var(--tx);
  letter-spacing: -0.03em;
  font-variant-numeric: tabular-nums;
}

.kpi-sub {
  font-size: 11.5px;
  color: var(--mu);
  margin-top: 4px;
  font-weight: 400;
}

/* Seção de Coordenadorias */
.ov-section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 12px 0 2px;
  flex-wrap: wrap;
  gap: 8px;
}

.ov-section-title {
  font-size: 15px;
  font-weight: 700;
  margin: 0;
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--tx);
  letter-spacing: -0.01em;
}

.ov-section-sub {
  font-size: 12px;
  color: var(--mu);
  margin-top: 2px;
}

.coords-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 14px;
}

.coord-card {
  background: var(--card);
  border-radius: var(--radius-lg);
  padding: 18px;
  box-shadow: var(--sh);
  border: 1px solid var(--bd);
  border-top: 4px solid var(--cc);
  cursor: pointer;
  transition: transform 0.18s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.18s, border-color 0.18s;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.coord-card:hover {
  transform: translateY(-3px);
  box-shadow: var(--sh-hover);
  border-color: color-mix(in srgb, var(--cc) 40%, var(--bd));
}

.coord-card-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
}

.coord-card-title {
  margin: 0;
  font-size: 14.5px;
  font-weight: 700;
  color: var(--tx);
  line-height: 1.3;
}

.coord-card-badge {
  font-size: 11px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 99px;
  flex: none;
}

.coord-card-badge.late {
  background: color-mix(in srgb, var(--late) 12%, transparent);
  color: var(--late);
  border: 1px solid color-mix(in srgb, var(--late) 25%, transparent);
}

.coord-card-badge.ok {
  background: color-mix(in srgb, var(--ok) 12%, transparent);
  color: var(--ok);
  border: 1px solid color-mix(in srgb, var(--ok) 25%, transparent);
}

.coord-card-badge.neutral {
  background: var(--card-subtle);
  color: var(--mu);
  border: 1px solid var(--bd);
}

.coord-card-body {
  display: flex;
  align-items: center;
  gap: 16px;
}

.coord-card-stats {
  flex: 1;
  font-size: 12px;
  line-height: 1.6;
  color: var(--mu);
}

.coord-card-stats strong {
  color: var(--tx);
  font-weight: 600;
}

.coord-card-footer {
  margin-top: auto;
  padding-top: 10px;
  border-top: 1px solid var(--bd-subtle);
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12px;
  font-weight: 600;
  color: var(--cc);
}

.coord-card-footer span.arrow {
  transition: transform 0.15s;
}

.coord-card:hover .coord-card-footer span.arrow {
  transform: translateX(4px);
}

/* Painel de Prazos (Atrasadas & Próximos Vencimentos) */
.ov-split-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

.ov-panel {
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: var(--radius-lg);
  padding: 20px;
  box-shadow: var(--sh);
}

.ov-panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}

.ov-panel-title {
  font-size: 14.5px;
  font-weight: 700;
  margin: 0;
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--tx);
  letter-spacing: -0.01em;
}

.ov-panel-count {
  font-size: 11px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 99px;
  background: var(--card-subtle);
  border: 1px solid var(--bd);
  color: var(--tx);
}

.ov-panel-count.late {
  background: var(--late);
  color: #fff;
  border-color: var(--late);
}

.ov-panel-cards {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.ov-empty-state {
  text-align: center;
  padding: 32px 16px;
  color: var(--mu);
  font-size: 12.5px;
  background: var(--card-subtle);
  border: 1px dashed var(--bd);
  border-radius: var(--radius-md);
}

.ov-empty-icon {
  width: 24px;
  height: 24px;
  margin: 0 auto 6px;
  opacity: 0.6;
  color: var(--mu);
}

/* ==========================================
   CARDS DE TAREFA, RINGS E COMPONENTES
   ========================================== */
.ring {
  --p: 0;
  width: 58px;
  height: 58px;
  border-radius: 50%;
  background: conic-gradient(var(--cc) calc(var(--p)*1%), var(--bd) 0);
  display: grid;
  place-items: center;
  flex: none;
}

.ring i {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: var(--card);
  display: grid;
  place-items: center;
  font: 700 12px var(--font-family);
  font-style: normal;
  letter-spacing: -0.02em;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 12px;
}

.card {
  background: var(--card);
  border-radius: var(--radius-md);
  padding: 12px 14px;
  box-shadow: var(--sh);
  border: 1px solid var(--bd);
  border-left: 3.5px solid var(--cc);
  cursor: grab;
  transition: transform 0.12s, box-shadow 0.12s, border-color 0.12s;
  position: relative;
}

.card:hover {
  transform: translateY(-2px);
  box-shadow: var(--sh-hover);
}

.card.dn .tt {
  text-decoration: line-through;
  color: var(--mu);
}

.ph {

  const lateTasks=srt(A.filter(x=>x.z==="late"));
  const upcomingTasks=srt(A.filter(x=>x.z!=="Concluído"&&x.z!=="late"&&dl(x.e)<=7));

  // 1. Cabeçalho Executivo Limpo
  const header=h("div",{cls:"ov-header"},
    h("div",{cls:"ov-header-left"},
      h("h2",{},"Visão Geral do Roadmap"),
      h("p",{},"Painel de entregas, fases e fluxo de trabalho das equipes da Reunião Regional.")
    ),
    h("div",{cls:"ov-header-actions"},
      h("button",{cls:"btn-secondary",on:{click:()=>go("gantt")}},
        '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>',
        "Ver Cronograma Geral"
      )
    )
  );
  w.append(header);

  // 2. Indicadores KPIs
  w.append(kpis(A));

  // 3. Seção de Coordenadorias
  const coordsSection=h("div",{},
    h("div",{cls:"ov-section-head"},
      h("div",{},
        h("h3",{cls:"ov-section-title"},"Coordenadorias",h("span",{cls:"n"},D.coords.length+"")),
        h("div",{cls:"ov-section-sub"},"Selecione uma área para visualizar o quadro de tarefas e gerenciar o fluxo")
      )
    ),
    h("div",{cls:"coords-grid"},
      D.coords.map(c=>{
        const a=A.filter(x=>x.c===c.id);
        const cDn=by(a,"Concluído");
        const cWip=by(a,"Em andamento");
        const cLate=by(a,"late");
        const cPct=a.length?Math.round(cDn/a.length*100):0;
        const nx=srt(a.filter(x=>x.z!=="Concluído"))[0];

        const badge=cLate>0
          ?h("span",{cls:"coord-card-badge late"},`${cLate} atrasada${cLate>1?"s":""}`)
          :cPct===100
          ?h("span",{cls:"coord-card-badge ok"},"100% concluído")
          :h("span",{cls:"coord-card-badge neutral"},`${cPct}% pronto`);

        return h("div",{cls:"coord-card",style:"--cc:"+c.color,on:{click:()=>go(c.id)}},
          h("div",{cls:"coord-card-top"},
            h("h4",{cls:"coord-card-title"},c.name),
            badge
          ),
          h("div",{cls:"coord-card-body"},
            ring(cPct,c.color),
            h("div",{cls:"coord-card-stats"},
              h("div",{},h("strong",{},`${cDn}/${a.length}`)," tarefas concluídas"),
              h("div",{},h("strong",{},`${cWip}`)," em execução"),
              cLate>0?h("div",{style:"color:var(--late);font-weight:600"},`${cLate} atrasada${cLate>1?"s":""}`):"",
              nx?h("div",{style:"font-size:11.5px;margin-top:2px"},"Próximo prazo: ",h("strong",{},fmt(nx.e))):h("div",{style:"font-size:11.5px;color:var(--ok)"},"Fases concluídas")
            )
          ),
          h("div",{cls:"coord-card-footer"},
            h("span",{},"Abrir quadro da equipe"),
            h("span",{cls:"arrow"},"→")
          )
        );
      })
    )
  );
  w.append(coordsSection);

  // 4. Painel de Prazos (Atrasadas & Próximos Vencimentos)
  const splitRow=h("div",{cls:"ov-split-row"},
    h("div",{cls:"ov-panel"},
      h("div",{cls:"ov-panel-header"},
        h("h4",{cls:"ov-panel-title"},"Entregas em Atraso"),
        h("span",{cls:"ov-panel-count"+(lateTasks.length?" late":"")},`${lateTasks.length}`)
      ),
      lateTasks.length?
        h("div",{cls:"ov-panel-cards"},lateTasks.slice(0,6).map(card)):
        h("div",{cls:"ov-empty-state"},
          h("div",{cls:"ov-empty-icon"},
            '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>'
          ),
          h("strong",{},"Tudo em dia"),
          h("p",{style:"margin:4px 0 0;font-size:12px"},"Nenhuma entrega com prazo expirado no momento.")
        )
    ),
    h("div",{cls:"ov-panel"},
      h("div",{cls:"ov-panel-header"},
        h("h4",{cls:"ov-panel-title"},"Próximos Vencimentos (7 dias)"),
        h("span",{cls:"ov-panel-count"},`${upcomingTasks.length}`)
      ),
      upcomingTasks.length?
        h("div",{cls:"ov-panel-cards"},upcomingTasks.slice(0,6).map(card)):
        h("div",{cls:"ov-empty-state"},
          h("div",{cls:"ov-empty-icon"},
            '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>'
          ),
          h("strong",{},"Sem entregas próximas"),
          h("p",{style:"margin:4px 0 0;font-size:12px"},"Nenhuma entrega programada para os próximos 7 dias.")
        )
    )
  );
  w.append(splitRow);

  // 5. Links e Documentos
  w.append(linksBox(),LG([["Status",L_ST],["Prazos",L_DUE]]));
  return w;
}

function coord(A,c){
  const dn=by(A,"Concluído"),w=h("div",{style:"--cc:"+c.color});
  w.append(h("div",{cls:"hd"},
    h("h2",{},c.name),
    h("div",{cls:"sub"},`${dn} de ${A.length} concluídas`),
    h("div",{cls:"bar"},h("i",{style:`width:${A.length?(dn/A.length*100):0}%`})),
    h("div",{cls:"seg"},[["board","Quadro"],["ph","Por fase"]].map(([k,l])=>h("button",{cls:view===k?"on":"",on:{click:()=>{view=k;render()}}},l))),
    h("button",{cls:"add",on:{click:()=>newTask(c.id)}},"+ Nova tarefa")
  ));
  const ps=D.phases.filter(p=>p.coord===c.id);
  w.append(h("div",{cls:"fl"},
    h("input",{id:"q",type:"search",placeholder:"Filtrar tarefas…",value:q,on:{input:e=>{q=e.target.value;render();$("#q").focus()}}}),
    h("button",{cls:"chip"+(!fph?" on":""),on:{click:()=>{fph="";render()}}},"Todas as fases"),
    ps.map(p=>h("button",{cls:"chip"+(fph===p.id?" on":""),title:p.name,on:{click:()=>{fph=p.id;render()}}},p.id+" "+p.name))
  ));
  w.append(LG([["Status",L_ST],["Prazo",L_DUE]].concat(view==="board"?[["Dica","Arraste os cards entre as colunas para atualizar o status"]]:[])));
  const F=A.filter(x=>(!fph||x.p===fph)&&(!q||x.t.toLowerCase().includes(q.toLowerCase())));
  
  if(view==="board"){
    w.append(h("div",{cls:"board"},ST.map(s=>{
      const a=srt(F.filter(x=>x.st===s));
      return h("div",{cls:"col",style:"border-top:3.5px solid "+SC[s],on:{dragover:e=>{e.preventDefault();e.currentTarget.classList.add("ov")},dragleave:e=>e.currentTarget.classList.remove("ov"),drop:e=>{e.preventDefault();e.currentTarget.classList.remove("ov");const id=e.dataTransfer.getData("text");if(id)save(id,{st:s})}}},
        h("h4",{},CN[s],h("span",{},a.length)),
        a.map(card)
      );
    })));
  } else {
    ps.forEach(p=>{
      const a=srt(F.filter(x=>x.p===p.id));
      if(!a.length)return;
      w.append(h("div",{cls:"ph2"},p.id+" · "+p.name,h("small",{},`${by(a,"Concluído")}/${a.length}`)),h("div",{cls:"grid"},a.map(card)));
    });
  }
  return w;
}

  const c=CO[x.c]||{color:"#475569"},S=$("#sh");S.style.setProperty("--cc",c.color);O.style.display="flex";
  const fld=(l,el)=>h("label",{},l,el),n=oname(x);
  S.replaceChildren(
    h("div",{cls:"sub",style:"margin-bottom:8px"},`${(c.name||"")} · ${x.p} · ${(PH[x.p]||{}).name||"Extra"}`),
    fld("Tarefa",h("textarea",{value:x.t,style:"min-height:56px",on:{change:e=>save(x.id,{t:e.target.value})}})),
    h("div",{cls:"two"},
      fld("Status",h("select",{on:{change:e=>save(x.id,{st:e.target.value})}},ST.map(s=>h("option",{value:s,selected:s===x.st},CN[s])))),
      fld("Responsável",h("button",{style:"text-align:left",on:{click:e=>pick(x.id,e.currentTarget)}},n||"+ Definir"))
    ),
    h("div",{cls:"two"},
      fld("Início",h("input",{type:"date",value:x.s,on:{change:e=>e.target.value&&save(x.id,{s:e.target.value})}})),
      fld("Prazo de conclusão",h("input",{type:"date",value:x.e,on:{change:e=>e.target.value&&save(x.id,{e:e.target.value})}}))
    ),
    fld("Observações",h("textarea",{value:x.obs,placeholder:"Anotações, links, decisões…",on:{change:e=>save(x.id,{obs:e.target.value})}})),
    h("div",{cls:"btns"},
      h("button",{style:"color:var(--late);background:none;border:none",on:{click:()=>{if(confirm("Excluir esta tarefa?")){const i=x.id;mid=null;save(i,{del:true});$("#ov").style.display="none"}}}},"Excluir"),
      h("button",{cls:"add",style:"background:"+c.color,on:{click:()=>{mid=null;O.style.display="none";render()}}},"Fechar")
    )
  );
}

function cfgModal(){
  const S=$("#sh"),O=$("#ov");S.style.setProperty("--cc","var(--tx)");O.style.display="flex";
  const nm=h("input",{value:D.name||"PERTENCER"}),dd=h("input",{type:"date",value:D.dday});
  S.replaceChildren(
    h("h3",{style:"margin:0 0 14px"},"Configurações do Evento"),
    h("label",{},"Nome do Evento",nm),
    h("label",{},"Data do Evento (D-Day)",dd),
    h("div",{cls:"btns"},
      h("button",{on:{click:()=>{O.style.display="none"}}},"Cancelar"),
      h("button",{cls:"add",style:"background:var(--tx);color:var(--bg)",on:{click:async()=>{
        if(!dd.value){toast("Escolha a data do evento.");return}
        D.name=nm.value.trim()||"PERTENCER";D.dday=dd.value;
        if(db){try{await db.collection("config").doc("event").set({name:D.name,dday:D.dday})}catch(e){}}
        else localStorage.setItem("pertencer_cfg",JSON.stringify({name:D.name,dday:D.dday}));
        O.style.display="none";toast("Configurações salvas.");render();
      }}},"Salvar")
    )
  );
}

function backupModal(){
  const S=$("#sh"),O=$("#ov");S.style.setProperty("--cc","var(--tx)");O.style.display="flex";
  const jsonArea=h("textarea",{style:"min-height:160px;font-family:monospace;font-size:11.5px",value:JSON.stringify({ov,links,config:{name:D.name,dday:D.dday}},null,2)});
  S.replaceChildren(
    h("h3",{style:"margin:0 0 10px"},"Backup e Sincronização"),
    h("p",{cls:"sub"},"Copie o JSON abaixo para salvar uma cópia local ou cole um JSON para restaurar:"),
    jsonArea,
    h("div",{cls:"btns",style:"margin-top:10px"},
      h("button",{on:{click:()=>{
        const blob=new Blob([jsonArea.value],{type:"application/json"});
        const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`pertencer-backup-${TODAY}.json`;a.click();
      }}},"Baixar .json"),
      h("button",{cls:"add",style:"background:var(--ok)",on:{click:()=>{
        try{
          const data=JSON.parse(jsonArea.value);
          if(data.ov)ov=data.ov;
          if(data.links)links=data.links;
          if(data.config){D.name=data.config.name||D.name;D.dday=data.config.dday||D.dday}
          localStorage.setItem("pertencer_tasks",JSON.stringify(ov));
          localStorage.setItem("pertencer_links",JSON.stringify(links));
          localStorage.setItem("pertencer_cfg",JSON.stringify(data.config||{}));
          render();O.style.display="none";toast("Dados restaurados com sucesso!");
        }catch(e){toast("JSON inválido. Verifique o formato.")}
      }}},"Restaurar JSON"),
      h("button",{on:{click:()=>O.style.display="none"}},"Fechar")
    )
  );
}

function newTask(c){
  const id="x"+Date.now(),e=iso(new Date(Date.now()+7*DAY)),p=(D.phases.find(p=>p.coord===c)||{}).id||"1.1";
  save(id,{n:1,t:"Nova tarefa",c,p:fph||p,s:TODAY,e,st:"Não iniciado"});
  mid=id;
  modal();
}

function pick(id,btn){
  const P=$("#pop"),r=btn.getBoundingClientRect(),I=$("#pq"),R=$("#pr");
  P.style.display="block";
  P.style.top=Math.max(8,Math.min(r.bottom+4,innerHeight-230))+"px";
  P.style.left=Math.max(8,Math.min(r.left,innerWidth-262))+"px";
  I.value="";I.focus();pt=id;
  const draw=()=>{
    const v=I.value.trim(),cur=all().find(t=>t.id===id);
    R.replaceChildren(...(v?[h("div",{on:{click:()=>fin({on:v})}},`Definir "${v}"`)]:[]),...(cur&&cur.on?[h("div",{style:"color:var(--late)",on:{click:()=>fin({on:""})}},"Remover responsável")]:[]));
  };
  I.oninput=draw;
  draw();
}
const fin=p=>{$("#pop").style.display="none";save(pt,p)};

function setSyncStatus(text, cls){
  const el = $("#syncStatus"), txt = $("#syncStatusText");
  if(txt) txt.textContent = text;
  else if(el) el.textContent = text;
  if(el){
    el.className = "pill " + (cls || "");
  }
}

async function initFirebase(cfg){
  if(!cfg || !window.firebase) return false;
  try {
    if(window.firebase.apps && window.firebase.apps.length){
      await Promise.all(window.firebase.apps.map(app => app.delete()));
    }
    firebase.initializeApp(cfg);
    db = firebase.firestore();
    setSyncStatus("Nuvem Online (Firebase)", "sync-ok");

    // Listeners em tempo real
    db.collection("links").onSnapshot(s => {
      links = s.docs.map(d => ({id: d.id, ...d.data()})).sort((a,b) => (a.ord||0) - (b.ord||0));
      localStorage.setItem("pertencer_links", JSON.stringify(links));
      render();
    }, err => {
      console.warn("Erro no listener de links:", err);
    });

    db.collection("config").doc("event").onSnapshot(s => {
      const c = s.data && s.data();
      if(c){
        if(c.name) D.name = c.name;
        if(c.dday) D.dday = c.dday;
        localStorage.setItem("pertencer_cfg", JSON.stringify({name: D.name, dday: D.dday}));
      }
      render();
    }, err => {
      console.warn("Erro no listener de config:", err);
    });

    db.collection("tasks").onSnapshot(s => {
      ov = {};
      s.docs.forEach(d => ov[d.id] = d.data());
      localStorage.setItem("pertencer_tasks", JSON.stringify(ov));
      render();
    }, err => {
      console.warn("Erro no listener de tarefas:", err);
      setSyncStatus("Erro de Permissão Firebase", "sync-local");
    });

    localStorage.setItem("pertencer_firebase_config", JSON.stringify(cfg));
    return true;
  } catch(e) {
    console.error("Falha ao inicializar Firebase:", e);
    setSyncStatus("Erro no Firebase", "sync-local");
    toast("Falha ao conectar no Firebase: " + (e.message || e));
    return false;
  }
}

async function uploadAllToFirebase(){
  if(!db){ toast("Firebase não conectado."); return; }
  try {
    toast("Enviando dados locais para o Firebase...");
    await db.collection("config").doc("event").set({name: D.name, dday: D.dday});
    for(const l of links){
      await db.collection("links").doc(l.id).set(l);
    }
    const allTasks = all();
    for(const t of allTasks){
      const patch = ov[t.id] || {};
      if(Object.keys(patch).length > 0){
        await db.collection("tasks").doc(t.id).set(patch);
      }
    }
    toast("Todos os dados foram salvos no Firebase! 🚀");
  } catch(e) {
    console.error("Erro no upload:", e);
    toast("Erro ao sincronizar com Firebase: " + (e.message || e));
  }
}

function firebaseModal(){
  const S = $("#sh"), O = $("#ov");
  S.style.setProperty("--cc", "var(--ok)");
  O.style.display = "flex";

  const savedCfg = localStorage.getItem("pertencer_firebase_config");
  const isConnected = !!db;

  const statusBox = isConnected
    ? h("div", {style: "background:color-mix(in srgb,var(--ok) 12%,transparent);color:var(--ok);padding:10px 14px;border-radius:var(--radius-md);font-weight:600;margin-bottom:12px;font-size:12.5px;display:flex;align-items:center;gap:8px"},
        "Sincronização ativa via Firebase Firestore (Tempo real)")
    : h("div", {style: "background:color-mix(in srgb,var(--wip) 12%,transparent);color:var(--wip);padding:10px 14px;border-radius:var(--radius-md);font-weight:600;margin-bottom:12px;font-size:12.5px;display:flex;align-items:center;gap:8px"},
        "Armazenamento local (Navegador)");

  const cfgArea = h("textarea", {
    style: "min-height:140px;font-family:monospace;font-size:11.5px",
    placeholder: 'Cole aqui o objeto firebaseConfig:\n{\n  apiKey: "...",\n  authDomain: "...",\n  projectId: "...",\n  storageBucket: "...",\n  messagingSenderId: "...",\n  appId: "..."\n}',
    value: savedCfg ? JSON.stringify(JSON.parse(savedCfg), null, 2) : (FIREBASE_CONFIG ? JSON.stringify(FIREBASE_CONFIG, null, 2) : "")
  });

  const close = () => { O.style.display = "none"; };

  S.replaceChildren(
    h("h3", {style: "margin:0 0 10px;color:var(--tx)"}, "Configuração do Firebase Firestore"),
    h("p", {cls: "sub", style: "margin:0 0 12px"}, "Conecte as credenciais do seu projeto Firebase para sincronizar tarefas, prazos e links entre todos os coordenadores em tempo real."),
    statusBox,
    h("label", {}, "Credenciais do Firebase (Objeto SDK ou JSON)", cfgArea),
    h("div", {cls: "btns", style: "margin-top:14px;flex-wrap:wrap;gap:8px"},
      isConnected ? h("button", {
        style: "color:var(--late);background:none;border:none",
        on: {
          click: () => {
            if(confirm("Deseja desconectar do Firebase e voltar a salvar apenas no navegador?")){
              localStorage.removeItem("pertencer_firebase_config");
              db = null;
              setSyncStatus("LocalStorage", "sync-local");
              toast("Desconectado do Firebase.");
              close();
              render();
            }
          }
        }
      }, "Desconectar") : h("span"),
      isConnected ? h("button", {
        style: "background:var(--card);border:1px solid var(--bd)",
        on: {click: uploadAllToFirebase}
      }, "Subir dados locais p/ Nuvem") : h("span"),
      h("button", {on: {click: close}}, "Fechar"),
      h("button", {
        cls: "add",
        style: "background:var(--ok)",
        on: {
          click: async () => {
            const raw = cfgArea.value.trim();
            if(!raw){
              toast("Cole as credenciais do Firebase.");
              return;
            }
            try {
              let parsed;
              const clean = raw.replace(/^(const|let|var)\s+\w+\s*=\s*/, "").replace(/;?\s*$/, "");
              try {
                parsed = JSON.parse(clean);
              } catch(e) {
                parsed = new Function("return (" + clean + ")")();
              }
              if(!parsed || !parsed.apiKey || !parsed.projectId){
                toast("Configuração inválida. Os campos apiKey e projectId são obrigatórios.");
                return;
              }
              const ok = await initFirebase(parsed);
              if(ok){
                toast("Conectado ao Firebase com sucesso!");
                close();
                render();
              }
            } catch(err) {
              toast("Erro ao ler credenciais: " + err.message);
            }
          }
        }
      }, "Conectar ao Firebase")
    )
  );
}

// ==========================================
// INICIALIZAÇÃO DE DADOS (FIREBASE OU LOCALSTORAGE)
// ==========================================
(function init(){
  // Initialize theme
  const savedTheme=localStorage.getItem("pertencer_theme");
  if(savedTheme){document.documentElement.setAttribute("data-theme",savedTheme)}
  updateThemeIcon();

  // Load local cache first so UI responds immediately
  try {
    const lk = localStorage.getItem("pertencer_links");if(lk)links=JSON.parse(lk);
    const ts = localStorage.getItem("pertencer_tasks");if(ts)ov=JSON.parse(ts);
    const cf = localStorage.getItem("pertencer_cfg");if(cf){const c=JSON.parse(cf);D.name=c.name||D.name;D.dday=c.dday||D.dday}
  } catch(e){}

  // Check for Firebase config (code or saved)
  const savedFb = localStorage.getItem("pertencer_firebase_config");
  let activeFb = null;
  if(FIREBASE_CONFIG){
    activeFb = FIREBASE_CONFIG;
  } else if(savedFb){
    try { activeFb = JSON.parse(savedFb); } catch(e){}
  }

  if(activeFb && window.firebase){
    initFirebase(activeFb);
  } else {
    setSyncStatus("LocalStorage", "sync-local");
  }

  render();
})();
</script>
